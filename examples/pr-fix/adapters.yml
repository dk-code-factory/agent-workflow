# Each inner list is a parallel barrier; outer lists run in order.
- identity: local:pr-review
  version: '1'
  kind: review
  cacheable: true
  history: false
  head-sensitive: false
  controls: []
  options: []
  resources: []
  procedure:
    - - id: standards
        role: pr-fix-leaf
        assignment: >-
          Review the pinned diff against documented repository standards.
          Inspect relevant source and checks. Return sourced actionable findings
          or an evidenced no-findings result. Do not edit, publish, or delegate.
        evidence: [documented-standards, reviewed-source, relevant-checks]
      - id: spec
        role: pr-fix-leaf
        assignment: >-
          Review the pinned diff against the originating request, Decisions,
          and accepted scope. Return sourced actionable findings or an evidenced
          no-findings result. Do not edit, publish, or delegate.
        evidence: [originating-request, decisions, reviewed-source]
