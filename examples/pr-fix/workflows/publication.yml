# Checked-in orchestration; helper calls retain separate operation boundaries.
name: One exact publication intent, audience verdict and receipt
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      proposal:
        type: object
        required: true
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      receipt:
        value: ${{ jobs.receipt.outputs.result.receipt }}
jobs:
  prepare:
    uses: examples/pr-fix/workflows/helper.yml
    with:
      operation: publication_prepare
      payload:
        plan: ${{ inputs.plan }}
        proposal: ${{ inputs.proposal }}
    secrets:
      github_token: ${{ secrets.github_token }}
  audience:
    needs: prepare
    uses: examples/pr-fix/workflows/task.yml
    with:
      plan: ${{ inputs.plan }}
      cycle: 0
      publication: ${{ needs.prepare.outputs.result.id }}
      task: publication_audience
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    if: ${{ needs.prepare.outputs.result.invoke }}
  publish:
    container:
      files:
      - helpers/
      - agents/
    steps:
    - argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - publication_execute
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        plan: ${{ inputs.plan }}
        id: ${{ needs.prepare.outputs.result.id }}
        agent: ${{ needs.audience.outputs.agent }}
        report: ${{ needs.audience.outputs.report }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
      id: published
    - argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - publication_record
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        plan: ${{ inputs.plan }}
        id: ${{ needs.prepare.outputs.result.id }}
        receipt: ${{ steps.published.outputs.receipt }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
      id: recorded
    needs:
    - prepare
    - audience
    outputs:
      receipt: ${{ steps.recorded.outputs.receipt }}
    if: ${{ needs.prepare.outputs.result.invoke and needs.audience.status == 'succeeded' }}
  receipt:
    uses: examples/pr-fix/workflows/helper.yml
    with:
      operation: publication_recover
      payload:
        plan: ${{ inputs.plan }}
        id: ${{ needs.prepare.outputs.result.id }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - publish
    if: ${{ needs.prepare.status == 'succeeded' and needs.publish.status != 'failed' and needs.publish.status !=
      'needs_attention' }}
