# Checked-in orchestration; helper calls retain separate operation boundaries.
name: Sequential publication barrier
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
jobs:
  list:
    uses: examples/pr-fix/workflows/helper.yml
    with:
      operation: publication_list
      payload:
        plan: ${{ inputs.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
  publish:
    needs: list
    uses: examples/pr-fix/workflows/publication.yml
    for-each:
      items: ${{ needs.list.outputs.result.items }}
      key: ${{ item.id }}
      concurrency: 1
    with:
      plan: ${{ inputs.plan }}
      proposal: ${{ item }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
