# Native role and session dispatch with a shared report contract.
name: Same-session checklist continuation
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      claim:
        type: string
        required: true
      agent:
        type: string
        required: true
      round:
        type: number
        required: true
      publication:
        type: string
        default: ''
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.accept.outputs.complete }}
      settled:
        value: ${{ jobs.accept.outputs.settled }}
schemas:
  task-report:
    type: object
    required:
    - complete
    - checklist
    - findings
    - evidence
    - blockers
    properties:
      complete:
        type: boolean
      checklist:
        type: array
        items:
          type: object
      findings:
        type: array
        items:
          type: object
      evidence:
        type: array
        items:
          type: object
      blockers:
        type: array
        items:
          type: string
      dispositions:
        type: array
        items:
          type: object
      changes:
        type: array
        items:
          type: object
      commit_message:
        type: string
      operations:
        type: array
        items:
          type: object
      audience:
        type: object
      deliverables:
        type: object
    additionalProperties: false
jobs:
  prepare:
    container:
      files:
      - helpers/
      - agents/
    steps:
    - argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - check_prepare
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        plan: ${{ inputs.plan }}
        claim: ${{ inputs.claim }}
        agent: ${{ inputs.agent }}
        round: ${{ inputs.round }}
        publication: ${{ inputs.publication }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
      id: check
    outputs:
      input: ${{ steps.check.outputs.task_input }}
      prompt: ${{ steps.check.outputs.prompt }}
  native:
    needs: prepare
    steps:
    - id: task
      uses: agent/run
      with:
        agent: ${{ inputs.agent }}
        turns: ${{ inputs.turns }}
        prompt: ${{ needs.prepare.outputs.prompt }}
        input: ${{ needs.prepare.outputs.input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
  accept:
    container:
      files:
      - helpers/
      - agents/
    steps:
    - argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - accept
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        plan: ${{ inputs.plan }}
        claim: ${{ inputs.claim }}
        agent: ${{ needs.native.outputs.agent }}
        report: ${{ needs.native.outputs.report }}
        round: ${{ inputs.round }}
        publication: ${{ inputs.publication }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
      id: accepted
    needs:
    - native
    outputs:
      complete: ${{ steps.accepted.outputs.complete }}
      settled: ${{ steps.accepted.outputs.settled }}
