# One report contract for initial turns, eligible retries and checklist corrections.
name: One native turn with retained report acceptance
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      claim:
        type: string
        required: true
      mode:
        type: string
        default: initial
      definition:
        type: string
        default: ''
      agent:
        type: string
        default: ''
      prompt:
        type: string
        default: ''
      task_input:
        type: object
        default: {}
      round:
        type: number
        default: 0
      publication:
        type: string
        default: ''
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      agent:
        value: ${{ jobs.result.outputs.agent }}
      report:
        value: ${{ jobs.result.outputs.report }}
      complete:
        value: ${{ jobs.accept.outputs.result.complete }}
      retry:
        value: ${{ jobs.accept.outputs.result.retry }}
      checklist:
        value: ${{ jobs.accept.outputs.result.checklist }}
      settled:
        value: ${{ jobs.accept.outputs.result.settled }}
      prompt:
        value: ${{ jobs.accept.outputs.result.prompt }}
      task_input:
        value: ${{ jobs.accept.outputs.result.task_input }}
schemas:
  task-report:
    type: object
    required:
    - complete
    - checklist
    - findings
    - evidence
    - blockers
    - dispositions
    - changes
    - commit_message
    - operations
    - audience
    - deliverables
    properties:
      complete:
        type: boolean
      checklist:
        type: array
        items:
          type: object
          required:
          - id
          - status
          - evidence
          properties:
            id:
              type: string
              description: An exact checklist ID from the original assignment. Never add IDs for supplemental
                checks or test commands; put those results in deliverables.
            status:
              type: string
              enum:
              - completed
              - incomplete
            evidence:
              type: array
              items:
                type: string
          additionalProperties: false
      findings:
        type: array
        items:
          type: object
          required:
          - id
          - text
          - sources
          properties:
            id:
              type: string
            text:
              type: string
            sources:
              type: array
              description: IDs from this report's evidence array only. Put original report/artifact references
                and source IDs absent from this report in deliverables.
              items:
                type: string
          additionalProperties: false
      evidence:
        type: array
        items:
          type: object
          required:
          - id
          - path
          - sha256
          properties:
            id:
              type: string
            path:
              type: string
              description: Workspace-relative current repository source file. Excludes .git, .agent-workflow,
                .pr-fix-state and generated workflow files. Captured artifacts are context and belong in deliverables.
            sha256:
              type: string
          additionalProperties: false
      blockers:
        type: array
        items:
          type: string
      dispositions:
        type: array
        items:
          type: object
          required:
          - finding_id
          - status
          - reason
          - sources
          - authorization
          properties:
            finding_id:
              type: string
            status:
              type: string
              enum:
              - confirmed
              - rejected
              - fixed
              - accepted
              - deferred
            reason:
              type: string
            sources:
              type: array
              description: IDs from this report's evidence array only. Put original report/artifact references
                and source IDs absent from this report in deliverables.
              items:
                type: string
            authorization:
              type:
              - object
              - 'null'
              required:
              - request_id
              - instruction
              - source
              properties:
                request_id:
                  type: string
                instruction:
                  type: string
                source:
                  type: string
              additionalProperties: false
          additionalProperties: false
      changes:
        type: array
        items:
          type: object
          required:
          - path
          - before
          - after
          properties:
            path:
              type: string
            before:
              type:
              - string
              - 'null'
            after:
              type:
              - string
              - 'null'
          additionalProperties: false
      commit_message:
        type:
        - string
        - 'null'
      operations:
        type: array
        items:
          type: string
          description: A JSON-encoded publication operation object with kind, payload, sources and original
            authorization references. Return an empty array when none are proposed.
      audience:
        type:
        - object
        - 'null'
        required:
        - fingerprint
        - suitable
        - audience
        - evidence
        properties:
          fingerprint:
            type: string
          suitable:
            type: boolean
          audience:
            type: string
          evidence:
            type: array
            items:
              type: string
        additionalProperties: false
      deliverables:
        type:
        - string
        - 'null'
        description: A JSON-encoded object for task-specific deliverables, or null when absent.
    additionalProperties: false
jobs:
  prepare:
    if: ${{ inputs.mode == 'checklist' }}
    container:
      files:
      - helpers/
      - agents/
    steps:
    - argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - check_prepare
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        plan: ${{ inputs.plan }}
        claim: ${{ inputs.claim }}
        agent: ${{ inputs.agent }}
        round: ${{ inputs.round }}
        publication: ${{ inputs.publication }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
      id: check
    outputs:
      input: ${{ steps.check.outputs.task_input }}
      prompt: ${{ steps.check.outputs.prompt }}
  leaf:
    if: ${{ inputs.mode == 'initial' and inputs.definition == 'leaf' }}
    steps:
    - id: task
      uses: agent/run
      with:
        agent: agents/leaf.toml
        turns: ${{ inputs.turns }}
        prompt: ${{ inputs.prompt }}
        input: ${{ inputs.task_input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
      continue-on-error: true
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
      status: ${{ steps.task.status }}
      error: ${{ steps.task.error }}
      failure_class: ${{ steps.task.failure_class }}
      unsafe_failure_class: ${{ steps.task.unsafe_failure_class }}
  reviewer:
    if: ${{ inputs.mode == 'initial' and inputs.definition == 'reviewer' }}
    steps:
    - id: task
      uses: agent/run
      with:
        agent: agents/reviewer.toml
        turns: ${{ inputs.turns }}
        prompt: ${{ inputs.prompt }}
        input: ${{ inputs.task_input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
      continue-on-error: true
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
      status: ${{ steps.task.status }}
      error: ${{ steps.task.error }}
      failure_class: ${{ steps.task.failure_class }}
      unsafe_failure_class: ${{ steps.task.unsafe_failure_class }}
  verifier:
    if: ${{ inputs.mode == 'initial' and inputs.definition == 'verifier' }}
    steps:
    - id: task
      uses: agent/run
      with:
        agent: agents/verifier.toml
        turns: ${{ inputs.turns }}
        prompt: ${{ inputs.prompt }}
        input: ${{ inputs.task_input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
      continue-on-error: true
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
      status: ${{ steps.task.status }}
      error: ${{ steps.task.error }}
      failure_class: ${{ steps.task.failure_class }}
      unsafe_failure_class: ${{ steps.task.unsafe_failure_class }}
  fixer:
    if: ${{ inputs.mode == 'initial' and inputs.definition == 'fixer' }}
    steps:
    - id: task
      uses: agent/run
      with:
        agent: agents/fixer.toml
        turns: ${{ inputs.turns }}
        prompt: ${{ inputs.prompt }}
        input: ${{ inputs.task_input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
      continue-on-error: true
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
      status: ${{ steps.task.status }}
      error: ${{ steps.task.error }}
      failure_class: ${{ steps.task.failure_class }}
      unsafe_failure_class: ${{ steps.task.unsafe_failure_class }}
  audience:
    if: ${{ inputs.mode == 'initial' and inputs.definition == 'audience' }}
    steps:
    - id: task
      uses: agent/run
      with:
        agent: agents/audience.toml
        turns: ${{ inputs.turns }}
        prompt: ${{ inputs.prompt }}
        input: ${{ inputs.task_input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
      continue-on-error: true
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
      status: ${{ steps.task.status }}
      error: ${{ steps.task.error }}
      failure_class: ${{ steps.task.failure_class }}
      unsafe_failure_class: ${{ steps.task.unsafe_failure_class }}
  retry:
    if: ${{ inputs.mode == 'retry' }}
    steps:
    - id: task
      uses: agent/run
      with:
        agent: ${{ inputs.agent }}
        turns: ${{ inputs.turns }}
        prompt: ${{ inputs.prompt }}
        input: ${{ inputs.task_input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
      continue-on-error: true
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
      status: ${{ steps.task.status }}
      error: ${{ steps.task.error }}
      failure_class: ${{ steps.task.failure_class }}
      unsafe_failure_class: ${{ steps.task.unsafe_failure_class }}
  checklist:
    if: ${{ inputs.mode == 'checklist' }}
    needs: prepare
    steps:
    - id: task
      uses: agent/run
      with:
        agent: ${{ inputs.agent }}
        turns: ${{ inputs.turns }}
        prompt: ${{ needs.prepare.outputs.prompt }}
        input: ${{ needs.prepare.outputs.input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
      status: ${{ steps.task.status }}
      error: ${{ steps.task.error }}
      failure_class: ${{ steps.task.failure_class }}
      unsafe_failure_class: ${{ steps.task.unsafe_failure_class }}
  result:
    container:
      files:
      - helpers/
      - agents/
    steps:
    - argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - native_result
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        plan: ${{ inputs.plan }}
        definition: ${{ inputs.definition }}
        mode: ${{ inputs.mode }}
        results:
          leaf:
            status: ${{ needs.leaf.status }}
            output: ${{ needs.leaf.outputs }}
          reviewer:
            status: ${{ needs.reviewer.status }}
            output: ${{ needs.reviewer.outputs }}
          verifier:
            status: ${{ needs.verifier.status }}
            output: ${{ needs.verifier.outputs }}
          fixer:
            status: ${{ needs.fixer.status }}
            output: ${{ needs.fixer.outputs }}
          audience:
            status: ${{ needs.audience.status }}
            output: ${{ needs.audience.outputs }}
          retry:
            status: ${{ needs.retry.status }}
            output: ${{ needs.retry.outputs }}
          checklist:
            status: ${{ needs.checklist.status }}
            output: ${{ needs.checklist.outputs }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
      id: selected
    needs:
    - leaf
    - reviewer
    - verifier
    - fixer
    - audience
    - retry
    - checklist
    outputs:
      agent: ${{ steps.selected.outputs.agent }}
      report: ${{ steps.selected.outputs.report }}
      status: ${{ steps.selected.outputs.status }}
      error: ${{ steps.selected.outputs.error }}
      failure_class: ${{ steps.selected.outputs.failure_class }}
      unsafe_failure_class: ${{ steps.selected.outputs.unsafe_failure_class }}
      accept_operation: ${{ steps.selected.outputs.accept_operation }}
    if: ${{ needs.leaf.status != 'needs_attention' and needs.leaf.status != 'failed' and
      needs.reviewer.status != 'needs_attention' and needs.reviewer.status != 'failed' and
      needs.verifier.status != 'needs_attention' and needs.verifier.status != 'failed' and
      needs.fixer.status != 'needs_attention' and needs.fixer.status != 'failed' and
      needs.audience.status != 'needs_attention' and needs.audience.status != 'failed' and
      needs.retry.status != 'needs_attention' and needs.retry.status != 'failed' and
      needs.checklist.status != 'needs_attention' and needs.checklist.status != 'failed' }}
  accept:
    needs: result
    container:
      files:
      - helpers/
      - agents/
    steps:
    - id: accepted
      argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - invoke
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        operation: ${{ needs.result.outputs.accept_operation }}
        payload:
          plan: ${{ inputs.plan }}
          claim: ${{ inputs.claim }}
          agent: ${{ needs.result.outputs.agent }}
          report: ${{ needs.result.outputs.report }}
          status: ${{ needs.result.outputs.status }}
          failure_class: ${{ needs.result.outputs.failure_class }}
          unsafe_failure_class: ${{ needs.result.outputs.unsafe_failure_class }}
          error: ${{ needs.result.outputs.error }}
          retried: ${{ inputs.mode == 'retry' }}
          round: ${{ inputs.round }}
          publication: ${{ inputs.publication }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
    outputs:
      result: ${{ steps.accepted.outputs }}
