# Checked-in orchestration; helper calls retain separate operation boundaries.
name: One declared task occurrence and its retained session
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      cycle:
        type: number
        required: true
      publication:
        type: string
        default: ''
      task:
        type: string
        required: true
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.status.outputs.result.complete }}
      agent:
        value: ${{ jobs.status.outputs.result.agent }}
      report:
        value: ${{ jobs.status.outputs.result.structured }}
jobs:
  prepare:
    uses: examples/pr-fix/workflows/helper.yml
    with:
      operation: claim
      payload:
        plan: ${{ inputs.plan }}
        task: ${{ inputs.task }}
        cycle: ${{ inputs.cycle }}
        publication: ${{ inputs.publication }}
    secrets:
      github_token: ${{ secrets.github_token }}
  native:
    needs: prepare
    if: ${{ needs.prepare.outputs.result.invoke }}
    uses: examples/pr-fix/workflows/native.yml
    with:
      plan: ${{ inputs.plan }}
      definition: ${{ needs.prepare.outputs.result.definition }}
      prompt: ${{ needs.prepare.outputs.result.prompt }}
      task_input: ${{ needs.prepare.outputs.result.task_input }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
  accept:
    uses: examples/pr-fix/workflows/helper.yml
    with:
      operation: turn_result
      payload:
        plan: ${{ inputs.plan }}
        claim: ${{ needs.prepare.outputs.result.claim }}
        agent: ${{ needs.native.outputs.agent }}
        report: ${{ needs.native.outputs.report }}
        status: ${{ needs.native.outputs.status }}
        failure_class: ${{ needs.native.outputs.failure_class }}
        unsafe_failure_class: ${{ needs.native.outputs.unsafe_failure_class }}
        error: ${{ needs.native.outputs.error }}
        publication: ${{ inputs.publication }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - native
    if: ${{ needs.prepare.outputs.result.invoke }}
  checklist:
    needs:
    - prepare
    - native
    - accept
    - retry
    if: ${{ needs.accept.outputs.result.checklist or needs.retry.outputs.checklist }}
    uses: examples/pr-fix/workflows/continue.yml
    repeat:
      max-attempts: 3
      until: ${{ iteration.outputs.settled }}
    secrets:
      github_token: ${{ secrets.github_token }}
    with:
      plan: ${{ inputs.plan }}
      claim: ${{ needs.prepare.outputs.result.claim }}
      agent: ${{ needs.native.outputs.agent }}
      round: ${{ iteration.number }}
      publication: ${{ inputs.publication }}
      turns: ${{ inputs.turns }}
  status:
    uses: examples/pr-fix/workflows/helper.yml
    with:
      operation: task_status
      payload:
        plan: ${{ inputs.plan }}
        claim: ${{ needs.prepare.outputs.result.claim }}
        publication: ${{ inputs.publication }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - native
    - accept
    - checklist
    - retry
    if: ${{ needs.prepare.status == 'succeeded' and needs.native.status != 'failed' and needs.native.status != 'needs_attention'
      and needs.accept.status != 'failed' and needs.accept.status != 'needs_attention' and needs.checklist.status
      != 'failed' and needs.checklist.status != 'needs_attention' and needs.retry.status != 'failed' and needs.retry.status
      != 'needs_attention' }}
  retry:
    needs:
    - prepare
    - native
    - accept
    if: ${{ needs.accept.outputs.result.retry }}
    uses: examples/pr-fix/workflows/retry.yml
    with:
      plan: ${{ inputs.plan }}
      claim: ${{ needs.prepare.outputs.result.claim }}
      agent: ${{ needs.native.outputs.agent }}
      prompt: ${{ needs.accept.outputs.result.prompt }}
      task_input: ${{ needs.accept.outputs.result.task_input }}
      publication: ${{ inputs.publication }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
