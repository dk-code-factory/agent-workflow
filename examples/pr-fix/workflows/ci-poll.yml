# Bounded CI observation chunk with a retained absolute deadline.
name: Bounded CI observation chunk
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
    secrets:
      github_token:
        required: true
    outputs:
      settled:
        value: ${{ jobs.observe.outputs.settled }}
      failed:
        value: ${{ jobs.observe.outputs.failed }}
jobs:
  observe:
    container:
      files:
      - helpers/
      - agents/
    steps:
    - argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - ci
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        plan: ${{ inputs.plan }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
      id: ci
    - id: delay
      if: ${{ steps.ci.outputs.pending }}
      argv:
      - sleep
      - '10'
    outputs:
      settled: ${{ steps.ci.outputs.pending != true }}
      failed: ${{ steps.ci.outputs.failed }}
    repeat:
      max-attempts: 100
      until: ${{ iteration.outputs.settled or iteration.number == 100 }}
