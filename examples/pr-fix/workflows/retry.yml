# Native role and session dispatch with a shared report contract.
name: One retained eligible same-session retry
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      claim:
        type: string
        required: true
      agent:
        type: string
        required: true
      prompt:
        type: string
        required: true
      task_input:
        type: object
        required: true
      publication:
        type: string
        default: ''
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.accept.outputs.complete }}
      checklist:
        value: ${{ jobs.accept.outputs.checklist }}
schemas:
  task-report:
    type: object
    required:
    - complete
    - checklist
    - findings
    - evidence
    - blockers
    properties:
      complete:
        type: boolean
      checklist:
        type: array
        items:
          type: object
      findings:
        type: array
        items:
          type: object
      evidence:
        type: array
        items:
          type: object
      blockers:
        type: array
        items:
          type: string
      dispositions:
        type: array
        items:
          type: object
      changes:
        type: array
        items:
          type: object
      commit_message:
        type: string
      operations:
        type: array
        items:
          type: object
      audience:
        type: object
      deliverables:
        type: object
    additionalProperties: false
jobs:
  native:
    steps:
    - id: task
      uses: agent/run
      with:
        agent: ${{ inputs.agent }}
        turns: ${{ inputs.turns }}
        prompt: ${{ inputs.prompt }}
        input: ${{ inputs.task_input }}
        output:
          format: json
          repair-attempts: 0
          schema: task-report
      continue-on-error: true
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      report: ${{ steps.task.outputs.structured }}
      status: ${{ steps.task.status }}
      error: ${{ steps.task.error }}
      failure_class: ${{ steps.task.failure_class }}
      unsafe_failure_class: ${{ steps.task.unsafe_failure_class }}
  accept:
    container:
      files:
      - helpers/
      - agents/
    steps:
    - argv:
      - python3
      - -B
      - /actions/helpers/action.py
      - turn_result
      protocol: action-v1
      effect: external_mutation
      input-schema:
        type: object
      output-schema:
        type: object
      input:
        plan: ${{ inputs.plan }}
        claim: ${{ inputs.claim }}
        agent: ${{ needs.native.outputs.agent }}
        report: ${{ needs.native.outputs.report }}
        retried: true
        status: ${{ needs.native.outputs.status }}
        error: ${{ needs.native.outputs.error }}
        failure_class: ${{ needs.native.outputs.failure_class }}
        unsafe_failure_class: ${{ needs.native.outputs.unsafe_failure_class }}
        publication: ${{ inputs.publication }}
      env:
        GH_TOKEN: ${{ secrets.github_token }}
        GH_ENTERPRISE_TOKEN: ${{ secrets.github_token }}
      id: accepted
    needs:
    - native
    outputs:
      complete: ${{ steps.accepted.outputs.complete }}
      checklist: ${{ steps.accepted.outputs.checklist }}
