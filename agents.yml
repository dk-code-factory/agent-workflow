# Native agent/run tasks use codex by default. Set agent-runtime to a configured
# codex-app-server or claude-sdk role to select another workspace-wide runtime.
# Claude CLI conversation roles below cannot be selected for native tasks.
agents:
  claude:
    provider: claude-cli
    # Omit model to use the CLI's configured default.
    permission-mode: dontAsk

  codex:
    provider: codex-app-server
    authentication: {mode: native}
    sandbox: read-only
  planner:
    provider: claude-cli
    permission-mode: plan
  builder:
    provider: codex-cli
    sandbox: workspace-write
  reviewer_claude:
    provider: claude-cli
    permission-mode: plan
  reviewer_codex:
    provider: codex-cli
    sandbox: read-only
