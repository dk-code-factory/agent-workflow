jobs:
  plan:
    steps:
      - uses: action/conformance-turn
        with:
          role: claude
          prompt: 'Plan a disposable task: create conformance.txt containing PUBLIC_CONFORMANCE_OK. Reply CONFORMANCE_OK after a brief plan.'
          structured: false
  build:
    needs: plan
    steps:
      - uses: agent/run
        with:
          agent: builder.toml
          prompt: 'Write conformance.txt containing exactly PUBLIC_CONFORMANCE_OK and a newline. Reply CONFORMANCE_OK.'
  check:
    needs: build
    steps:
      - argv: [sh, -c, 'test "$(cat conformance.txt)" = PUBLIC_CONFORMANCE_OK']
  review_claude:
    needs: check
    steps:
      - uses: action/conformance-turn
        with:
          role: claude
          prompt: 'Read conformance.txt. Return exactly {"ok":true} only if it contains PUBLIC_CONFORMANCE_OK.'
          structured: true
  review_codex:
    needs: check
    steps:
      - uses: agent/run
        with:
          agent: reviewer.toml
          prompt: 'Read conformance.txt and independently verify it contains PUBLIC_CONFORMANCE_OK. Reply CONFORMANCE_OK.'
