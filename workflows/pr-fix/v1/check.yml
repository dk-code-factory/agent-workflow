name: PR fix same-session checklist follow-up v1
on:
  workflow_call:
    inputs:
      plan: {type: string, required: true}
      claim: {type: string, required: true}
      round: {type: number, required: true}
    outputs:
      settled: {value: '${{ jobs.finish.outputs.settled }}'}
jobs:
  prepare:
    outputs:
      round: ${{ steps.prepare.outputs.round }}
      invoke: ${{ steps.prepare.outputs.invoke }}
    steps:
      - id: prepare
        uses: action/prfix_check_prepare
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}'}
  turn:
    needs: prepare
    if: ${{ needs.prepare.outputs.invoke }}
    steps:
      - id: prepare
        uses: action/prfix_task_prepare
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ needs.prepare.outputs.round }}'}
      - id: task
        uses: agent/run
        continue-on-error: true
        with:
          agent: ${{ steps.prepare.outputs.agent }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          input: ${{ steps.prepare.outputs.task_input }}
          output: {format: json, repair-attempts: 0, schema: {type: object, required: [complete], properties: {complete: {type: boolean}}}}
        onResult:
          - id: verify_envelope
            argv: [python3, -c, 'import json,sys; e=json.load(sys.stdin); r=e["result"]; checks=r.get("checklist", []); verified=bool(checks) and all(c.get("status")=="completed" and c.get("evidence") for c in checks); print(json.dumps({"complete": bool(r["complete"] and verified), "feedback": {"checklist_verification_required": not verified}}))']
        onComplete:
          - id: accepted
            argv: [python3, -c, 'import json,sys; e=json.load(sys.stdin); assert e["verification"]["complete"]; print("Agent envelope accepted; application evidence validation follows.", file=sys.stderr)']
        onIncomplete:
          - id: checklist_feedback
            argv: [python3, -c, 'import json,sys; e=json.load(sys.stdin); print(json.dumps({"feedback": "Application checklist policy selects the next explicitly bounded same-session turn.", "verification": e["verification"]}))']
            with: {output: {format: json, repair-attempts: 0}}
        onError:
          - id: recovery_feedback
            argv: [python3, -c, 'import json,sys; e=json.load(sys.stdin); print(json.dumps({"feedback": "Retain the original error and require application retry disposition.", "error": e["error"]}))']
            with: {output: {format: json, repair-attempts: 0}}
        onFailure:
          - id: report_error
            argv: [python3, -c, 'import json,sys; e=json.load(sys.stdin); print(json.dumps(e["error"]), file=sys.stderr)']
        finally:
          - id: finish_turn
            argv: [python3, -c, 'import json,sys; e=json.load(sys.stdin); print("Agent turn hooks finished.", file=sys.stderr)']
      - id: result
        uses: action/prfix_task_result
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ needs.prepare.outputs.round }}', agent: '${{ steps.task.outputs.agent }}'}
  finish:
    needs: [prepare, turn]
    if: ${{ needs.prepare.status == 'succeeded' and needs.turn.status != 'failed' and needs.turn.status != 'needs_attention' and needs.turn.status != 'canceled' }}
    outputs:
      settled: ${{ steps.finish.outputs.settled }}
    steps:
      - id: finish
        uses: action/prfix_finish
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ needs.prepare.outputs.round }}'}
