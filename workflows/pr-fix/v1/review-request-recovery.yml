name: PR fix uncertain review request recovery v1
on:
  workflow_call:
    inputs:
      plan: {type: string, required: true}
      intent: {type: object, required: true}
jobs:
  inspect:
    steps:
      - uses: action/prfix_review_request_inspect
        with:
          plan: ${{ inputs.plan }}
          intent: ${{ inputs.intent.id }}
          kind: uncertain
  audience:
    needs: inspect
    uses: workflows/pr-fix/v1/occurrence.yml
    with:
      plan: ${{ inputs.plan }}
      occurrence: audience
      cycle: review-request-recovery
      payload: ${{ inputs.intent.id }}
  dispose:
    needs: audience
    steps:
      - uses: action/prfix_review_request_dispose
        with:
          plan: ${{ inputs.plan }}
          intent: ${{ inputs.intent.id }}
          claim: ${{ needs.audience.outputs.claim }}
          kind: no_resend
