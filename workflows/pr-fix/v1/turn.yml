name: PR fix retained native turn and explicit session recovery v1
on:
  workflow_call:
    inputs:
      plan: {type: string, required: true}
      claim: {type: string, required: true}
      round: {type: number, default: 0}
    outputs:
      settled: {value: '${{ jobs.turn.outputs.settled }}'}
jobs:
  turn:
    outputs:
      settled: ${{ steps.state.outputs.settled }}
    steps:
      - id: send
        uses: action/prfix_worker_send
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ inputs.round }}'}
      - id: recover
        if: ${{ steps.send.outputs.deferred }}
        uses: action/prfix_worker_recover
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ inputs.round }}'}
      - id: adopt
        if: ${{ steps.send.outputs.deferred }}
        uses: action/prfix_worker_adopt
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ inputs.round }}', worker: '${{ steps.recover.outputs.worker }}'}
      - id: resend
        if: ${{ steps.send.outputs.deferred }}
        uses: action/prfix_worker_send
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ inputs.round }}'}
      - id: wait
        if: ${{ steps.resend.outputs.deferred != true }}
        uses: action/prfix_worker_wait
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ inputs.round }}'}
      - id: state
        uses: action/prfix_turn_state
        with: {plan: '${{ inputs.plan }}', claim: '${{ inputs.claim }}', round: '${{ inputs.round }}'}
