name: Parallel correctness and security review
on:
    manual: {}
    workflow_call:
        inputs:
            task:
                type: string
                required: true
        outputs:
            summary:
                value: ${{ jobs.combine.outputs.summary }}
jobs:
    correctness_review:
        outputs:
            findings: ${{ steps.review.outputs.text }}
        steps:
            - id: review
              uses: agent/run
              with:
                prompt: |
                    Review the task below for correctness risks. Inspect relevant files
                    if useful. Return findings only. Do not edit files.
                    Task: ${{ inputs.task }}
                agent: agents/review_correctness.toml
    security_review:
        outputs:
            findings: ${{ steps.review.outputs.text }}
        steps:
            - id: review
              uses: agent/run
              with:
                prompt: |
                    Review the task below for security and test gaps. Inspect relevant
                    files if useful. Return findings only. Do not edit files.
                    Task: ${{ inputs.task }}
                agent: agents/review_security.toml
    combine:
        needs: [correctness_review, security_review]
        outputs:
            summary: ${{ steps.merge.outputs.text }}
        steps:
            - id: merge
              uses: agent/run
              with:
                prompt: |
                    Combine these independent reviews. Remove duplicates and preserve
                    disagreements. Do not edit files.

                    Correctness findings:
                    ${{ needs.correctness_review.outputs.findings }}

                    Security findings:
                    ${{ needs.security_review.outputs.findings }}
                agent: agents/task.toml
