name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux/amd64}
          - {runner: ubuntu-24.04-arm, platform: linux/arm64}
          - {runner: macos-15-intel, platform: darwin/amd64}
          - {runner: macos-15, platform: darwin/arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # Match go.mod toolchain and images/pins.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: test "$(go env GOOS)/$(go env GOARCH)" = '${{ matrix.platform }}'
      - run: make test check build
      - run: npm ci --prefix bridge/claude --ignore-scripts
      - run: node --check bridge/claude/bridge.mjs
      - run: go test ./pkg/clirunner -run 'TestSDK(Bridge|Broker)AgainstFakeGateway' -count=1
        env:
          AGENT_WORKFLOW_SDK_TEST: '1'
      - run: python3 scripts/build-release.py --platform '${{ matrix.platform }}' --smoke
      - run: python3 scripts/verify-release.py dist
  workflow-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # Match go.mod toolchain and images/pins.json.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
  filesystem-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # Match go.mod toolchain and images/pins.json.
      - name: Exhaust only a bounded tmpfs in a private mount namespace
        run: sudo env "PATH=$PATH" AGENT_WORKFLOW_FILESYSTEM_TEST=1 go test ./pkg/workflows -run '^TestDisposableFilesystemExhaustion$' -count=1
  container-conformance:
    name: Container (${{ matrix.runtime }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runtime: docker, runner: ubuntu-24.04, arch: amd64}
          - {runtime: podman, runner: ubuntu-24.04, arch: amd64}
          - {runtime: docker, runner: ubuntu-24.04-arm, arch: arm64}
          - {runtime: podman, runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # Match go.mod toolchain and images/pins.json.
      - name: Install Podman when selected
        if: matrix.runtime == 'podman'
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Verify genuine runtime and non-root execution
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          test "$(id -u)" != 0
          "$RUNTIME" version
          if [ "$RUNTIME" = docker ]; then docker version --format '{{.Server.Platform.Name}}' | grep -i docker; fi
          if [ "$RUNTIME" = podman ]; then test "$(podman info --format '{{.Host.Security.Rootless}}')" = true; fi
      - run: python3 scripts/build-worker-image.py --runtime '${{ matrix.runtime }}' --arch '${{ matrix.arch }}'
      - name: Exercise real runtime without model calls
        env:
          AGENT_WORKFLOW_CONTAINER_RUNTIME: ${{ matrix.runtime }}
          ARCH: ${{ matrix.arch }}
        run: |
          export AGENT_WORKFLOW_CONTAINER_IMAGE="$(cat "dist/worker-linux-$ARCH.iid")"
          go test ./pkg/clirunner -run '^TestContainer(ExecutionAndCleanup|RuntimeRemoval)$' -count=1
  required:
    name: Required
    if: always()
    needs: [native, workflow-validation, filesystem-conformance, container-conformance]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY
