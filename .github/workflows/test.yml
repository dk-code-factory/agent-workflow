name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native Linux AMD64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # Match go.mod toolchain and images/pins.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: test "$(go env GOOS)/$(go env GOARCH)" = 'linux/amd64'
      - run: make test check build
      - run: npm ci --prefix bridge/claude --ignore-scripts
      - run: node --check bridge/claude/bridge.mjs
      - run: go test ./pkg/clirunner -run 'TestSDK(Bridge|Broker|Conversation)AgainstFakeGateway' -count=1
        env:
          AGENT_WORKFLOW_SDK_TEST: '1'
  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # Match go.mod toolchain and images/pins.json.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=
  workflow-ui:
    name: Workflow UI Chromium
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with @playwright/test in ui/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui --ignore-scripts
      - name: Check flow checker and UF documentation synchronization
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --test ui/scripts/flows-check.test.mjs
          node ui/scripts/flows-check.mjs --ci
      - name: Check types and unit tests
        run: |
          npm run check --prefix ui
          npm test --prefix ui
      - name: Build and test packed consumers
        run: |
          npm run build --prefix ui
          npm run test:consumers --prefix ui
      - name: Run browser tests
        run: npm run test:browser --prefix ui -- --project=chromium
      - name: Upload UI browser failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-ui-chromium-failure
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
  required:
    name: Required
    if: always()
    needs: [native, workflow-validation, workflow-ui]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY
