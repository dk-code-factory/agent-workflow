name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch origin main:refs/remotes/origin/main
      - name: Validate signed candidate and exact-commit main CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/validate-release.py "$TAG" --phase candidate
  checks:
    needs: validate
    uses: ./.github/workflows/pre-release.yml
  archives:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # Match go.mod toolchain and images/pins.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - run: python3 scripts/build-release.py --smoke
      - name: Require identical archive bytes on a second build
        run: |
          python3 scripts/build-release.py --output .agent-workflow/repro
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from release_lib import sha256
          for archive in Path('dist').glob('agent-workflow-*.tar.gz'):
              assert sha256(archive) == sha256(Path('.agent-workflow/repro') / archive.name), archive
          PY
      - run: python3 scripts/audit-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/dependencies.json
            dist/sbom.cdx.json
            dist/*vulnerabilit*.json
          if-no-files-found: error
  images:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # Match go.mod toolchain and images/pins.json.
      - run: python3 scripts/build-worker-image.py --runtime docker --arch '${{ matrix.arch }}'
      - name: Test the exact distribution image
        env:
          ARCH: ${{ matrix.arch }}
          AGENT_WORKFLOW_CONTAINER_RUNTIME: docker
        run: |
          export AGENT_WORKFLOW_CONTAINER_IMAGE="$(cat "dist/worker-linux-$ARCH.iid")"
          go test ./pkg/clirunner -run '^TestContainer(ExecutionAndCleanup|RuntimeRemoval)$' -count=1
          python3 scripts/verify-worker-image.py --runtime "$AGENT_WORKFLOW_CONTAINER_RUNTIME" --image "$AGENT_WORKFLOW_CONTAINER_IMAGE"
      - name: Scan the actual image archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.57.0
          go install github.com/aquasecurity/trivy/cmd/trivy@v0.76.2
          syft "docker-archive:dist/worker-linux-$ARCH.docker.tar" -o "cyclonedx-json=dist/worker-linux-$ARCH.sbom.json"
          trivy image --input "dist/worker-linux-$ARCH.docker.tar" --severity HIGH,CRITICAL --exit-code 1 --format json --output "dist/worker-linux-$ARCH.vulnerabilities.json"
      - run: python3 scripts/compress-worker-image.py '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: |
            dist/worker-*.tar.gz
            dist/worker-*.json
          if-no-files-found: error
  provider-e2e:
    needs: [archives, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: pre-release
    outputs:
      artifact: provider-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - name: Install locked provider clients and isolated runtime prerequisites
        run: |
          npm ci --prefix conformance/providers --ignore-scripts --no-audit --no-fund
          node conformance/providers/node_modules/@anthropic-ai/claude-code/install.cjs
          conformance/providers/node_modules/.bin/claude --version
          npm ci --prefix images/codex --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns
      - name: Materialize private subscription authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/release_e2e.py setup --state "$RUNNER_TEMP/release-provider-e2e"
      - name: Smoke and resumable session E2E
        run: python3 scripts/release_e2e.py smoke --state "$RUNNER_TEMP/release-provider-e2e"
      - name: Full provider and disposable runtime recovery matrix
        run: python3 scripts/release_e2e.py matrix --state "$RUNNER_TEMP/release-provider-e2e"
      - name: Require complete sanitized evidence
        run: python3 scripts/release_e2e.py aggregate --state "$RUNNER_TEMP/release-provider-e2e" --output dist/e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/e2e/automated-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove owned credentials, transcripts and disposable runtime storage
        if: always()
        run: python3 scripts/release_e2e.py cleanup --state "$RUNNER_TEMP/release-provider-e2e"
  certify:
    needs: [archives, images, provider-e2e]
    if: ${{ needs.archives.result == 'success' && needs.images.result == 'success' && needs.provider-e2e.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release-certification
    outputs:
      artifact: certified-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provider-e2e.outputs.artifact }}
          path: dist
      - name: Fetch human-reviewed report after approval and pin verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main:refs/remotes/origin/main release-evidence:refs/remotes/origin/release-evidence
          python3 scripts/validate-release.py "$TAG" --automated-evidence dist/automated-evidence.json --pin-output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certified-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/conformance-evidence.json
            dist/conformance-evidence.json.asc
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [archives, images, provider-e2e, certify]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provider-e2e.outputs.artifact }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.certify.outputs.artifact }}
          path: dist
      - run: python3 scripts/validate-release.py "$TAG" --report-file dist/conformance-evidence.json --automated-evidence dist/automated-evidence.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/release-docker" >> "$GITHUB_ENV"
      - name: Login to GHCR using only this job's token
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested images and assemble index without rebuilding
        id: registry
        run: python3 scripts/publish-release.py registry "$TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: image_index
        with:
          subject-name: ghcr.io/dk-code-factory/agent-workflow-worker
          subject-digest: ${{ steps.registry.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: image_amd64
        with:
          subject-name: ghcr.io/dk-code-factory/agent-workflow-worker
          subject-digest: ${{ steps.registry.outputs.amd64 }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: image_arm64
        with:
          subject-name: ghcr.io/dk-code-factory/agent-workflow-worker
          subject-digest: ${{ steps.registry.outputs.arm64 }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: archives
        with:
          subject-path: dist/*.tar.gz
      - run: cp "$BUNDLE" dist/archive-provenance.jsonl
        env:
          BUNDLE: ${{ steps.archives.outputs.bundle-path }}
      - name: Include container provenance bundles
        env:
          INDEX: ${{ steps.image_index.outputs.bundle-path }}
          AMD64: ${{ steps.image_amd64.outputs.bundle-path }}
          ARM64: ${{ steps.image_arm64.outputs.bundle-path }}
        run: |
          cp "$INDEX" dist/image-index-provenance.jsonl
          cp "$AMD64" dist/image-amd64-provenance.jsonl
          cp "$ARM64" dist/image-arm64-provenance.jsonl
      - run: python3 scripts/publish-release.py inventory "$TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: manifest
        with:
          subject-path: dist/release-manifest.json
      - run: cp "$BUNDLE" dist/manifest-provenance.jsonl
        env:
          BUNDLE: ${{ steps.manifest.outputs.bundle-path }}
      - run: python3 scripts/publish-release.py checksums "$TAG"
      - run: python3 scripts/verify-release.py dist
      - name: Verify draft downloads and provenance; publish immutably; verify public release
        run: python3 scripts/publish-release.py publish "$TAG"
      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io
